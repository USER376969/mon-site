<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russian BombParty Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 25%, rgba(100, 80, 180, 0.14), transparent 35%),
        radial-gradient(circle at 80% 75%, rgba(180, 70, 130, 0.10), transparent 40%),
        linear-gradient(135deg, #10121d 0%, #181525 35%, #211629 70%, #12121c 100%);
      color: white;
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(255, 130, 185, 0.10);
      user-select: none;
      animation: floatHeart 14s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
        opacity: 0.45;
      }

      50% {
        transform: translateY(-16px) rotate(5deg);
        opacity: 1;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
    }

    #syllabe {
      position: absolute;
      top: 31%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: min(90vw, 720px);
      margin: 0;
      padding: 0;

      border: none;
      outline: none;
      background: transparent;

      color: white;
      caret-color: #ff91bd;

      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 800;
      line-height: 1;

      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
    }

    #syllabe::placeholder {
      color: rgba(255, 255, 255, 0.22);
    }

    #resultat {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);

      max-width: 94vw;
      overflow: hidden;
      text-overflow: ellipsis;

      color: white;
      text-align: center;
      white-space: nowrap;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 800;
      line-height: 1;

      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
    }

    .match {
      color: #ff8fbd;
      text-shadow: 0 0 18px rgba(255, 100, 170, 0.25);
    }

    .muted {
      color: rgba(255, 255, 255, 0.42);
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);

      color: rgba(255, 255, 255, 0.30);
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    #status.ok {
      color: rgba(145, 255, 179, 0.40);
    }

    #status.error {
      color: rgba(255, 130, 155, 0.70);
    }
  </style>
</head>

<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart" style="left:6%;top:12%;font-size:30px;animation-delay:-2s">♥</span>
    <span class="heart" style="left:14%;top:62%;font-size:18px;animation-delay:-8s">♥</span>
    <span class="heart" style="left:23%;top:30%;font-size:24px;animation-delay:-4s">♥</span>
    <span class="heart" style="left:31%;top:82%;font-size:34px;animation-delay:-10s">♥</span>
    <span class="heart" style="left:41%;top:9%;font-size:17px;animation-delay:-6s">♥</span>
    <span class="heart" style="left:53%;top:72%;font-size:25px;animation-delay:-1s">♥</span>
    <span class="heart" style="left:62%;top:18%;font-size:36px;animation-delay:-9s">♥</span>
    <span class="heart" style="left:72%;top:80%;font-size:20px;animation-delay:-5s">♥</span>
    <span class="heart" style="left:83%;top:27%;font-size:28px;animation-delay:-11s">♥</span>
    <span class="heart" style="left:93%;top:67%;font-size:32px;animation-delay:-3s">♥</span>
    <span class="heart" style="left:4%;top:88%;font-size:16px;animation-delay:-7s">♥</span>
    <span class="heart" style="left:88%;top:91%;font-size:19px;animation-delay:-12s">♥</span>
  </div>

  <main class="container">
    <input
      id="syllabe"
      type="text"
      placeholder="слог"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      autofocus
    >

    <div id="resultat"></div>
    <div id="status">Загрузка словаря…</div>
  </main>

  <script>
    "use strict";

    const input = document.getElementById("syllabe");
    const resultat = document.getElementById("resultat");
    const status = document.getElementById("status");

    let mots = [];
    let dictionnairePret = false;
    let erreurDictionnaire = false;
    let dernierSuppr = 0;

    const collatorRusse = new Intl.Collator("ru", {
      sensitivity: "base"
    });

    function normaliser(texte) {
      return texte
        .normalize("NFC")
        .trim()
        .toLocaleLowerCase("ru-RU");
    }

    function echapperHTML(texte) {
      return texte.replace(/[&<>"']/g, caractere => {
        const table = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return table[caractere];
      });
    }

    function afficherMessage(message) {
      resultat.innerHTML =
        `<span class="muted">${echapperHTML(message)}</span>`;
    }

    async function chargerDictionnaire() {
      try {
        /*
          On garde le nom fr.txt pour que tu n'aies rien
          à changer sur GitHub. Le contenu peut être russe.
        */
        const response = await fetch("./fr.txt", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status} ${response.statusText}`
          );
        }

        const texte = await response.text();

        mots = texte
          .split(/\r?\n/)
          .map(normaliser)
          .filter(Boolean);

        /*
          On retire les doublons.
        */
        mots = [...new Set(mots)];

        /*
          Priorité au mot valide le plus court,
          mais jamais au mot exactement identique
          à la syllabe tapée.
        */
        mots.sort((a, b) => {
          const differenceLongueur =
            a.length - b.length;

          if (differenceLongueur !== 0) {
            return differenceLongueur;
          }

          return collatorRusse.compare(a, b);
        });

        dictionnairePret = true;

        status.textContent =
          `${mots.length.toLocaleString("ru-RU")} слов загружено`;

        status.className = "ok";

        console.log(
          "Русский словарь загружен:",
          mots.length,
          "слов"
        );

        chercherMot();
      }
      catch (error) {
        erreurDictionnaire = true;

        console.error(
          "Ошибка загрузки словаря:",
          error
        );

        status.textContent =
          "Ошибка загрузки fr.txt";

        status.className = "error";

        afficherMessage("Ошибка словаря");
      }
    }

    /*
      Recherche simple.

      Exemple :
      бакс

      On refuse :
      бакс

      On accepte par exemple :
      баксовый
      небаксовый
      etc. si présent dans le dictionnaire.
    */
    function trouverMotSimple(recherche) {
      return mots.find(mot =>
        mot.length > recherche.length &&
        mot.includes(recherche)
      ) ?? null;
    }

    /*
      Recherche de plusieurs morceaux dans l'ordre.

      Exemple :
      ба ов

      cherche un mot contenant d'abord "ба",
      puis plus loin "ов".
    */
    function trouverMotAvecMorceaux(morceaux) {
      const longueurMinimum =
        morceaux.reduce(
          (total, morceau) =>
            total + morceau.length,
          0
        );

      for (const mot of mots) {
        /*
          Évite également de renvoyer uniquement
          la concaténation exacte des morceaux.
        */
        if (mot.length <= longueurMinimum) {
          continue;
        }

        let positionRecherche = 0;
        const positions = [];
        let valide = true;

        for (const morceau of morceaux) {
          const index =
            mot.indexOf(
              morceau,
              positionRecherche
            );

          if (index === -1) {
            valide = false;
            break;
          }

          positions.push({
            debut: index,
            fin: index + morceau.length
          });

          positionRecherche =
            index + morceau.length;
        }

        if (valide) {
          return {
            mot,
            positions
          };
        }
      }

      return null;
    }

    function afficherMotSimple(
      mot,
      recherche
    ) {
      const index =
        mot.indexOf(recherche);

      const avant =
        echapperHTML(
          mot.slice(0, index)
        );

      const milieu =
        echapperHTML(
          mot.slice(
            index,
            index + recherche.length
          )
        );

      const apres =
        echapperHTML(
          mot.slice(
            index + recherche.length
          )
        );

      resultat.innerHTML =
        `${avant}<span class="match">${milieu}</span>${apres}`;
    }

    function afficherMotAvecMorceaux(
      mot,
      positions
    ) {
      let html = "";
      let dernierePosition = 0;

      for (const position of positions) {
        html +=
          echapperHTML(
            mot.slice(
              dernierePosition,
              position.debut
            )
          );

        html +=
          `<span class="match">${
            echapperHTML(
              mot.slice(
                position.debut,
                position.fin
              )
            )
          }</span>`;

        dernierePosition =
          position.fin;
      }

      html +=
        echapperHTML(
          mot.slice(dernierePosition)
        );

      resultat.innerHTML = html;
    }

    function chercherMot() {
      const recherche =
        normaliser(input.value);

      if (!recherche) {
        resultat.innerHTML = "";
        return;
      }

      if (erreurDictionnaire) {
        afficherMessage("Ошибка словаря");
        return;
      }

      if (!dictionnairePret) {
        afficherMessage("Загрузка…");
        return;
      }

      /*
        Recherche classique :
        une seule suite de caractères.
      */
      if (!recherche.includes(" ")) {
        const motTrouve =
          trouverMotSimple(recherche);

        if (!motTrouve) {
          afficherMessage("Нет слова");
          return;
        }

        afficherMotSimple(
          motTrouve,
          recherche
        );

        return;
      }

      /*
        Recherche de plusieurs morceaux.
      */
      const morceaux =
        recherche
          .split(/\s+/)
          .map(normaliser)
          .filter(Boolean);

      if (morceaux.length === 0) {
        resultat.innerHTML = "";
        return;
      }

      const trouve =
        trouverMotAvecMorceaux(
          morceaux
        );

      if (!trouve) {
        afficherMessage("Нет слова");
        return;
      }

      afficherMotAvecMorceaux(
        trouve.mot,
        trouve.positions
      );
    }

    input.addEventListener(
      "input",
      chercherMot
    );

    /*
      Ton ancien comportement est conservé :

      - premier Backspace/Delete après 2 secondes :
        efface tout

      - les suivants dans les 2 secondes :
        suppression normale lettre par lettre
    */
    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key !== "Delete" &&
          event.key !== "Backspace"
        ) {
          return;
        }

        const maintenant =
          Date.now();

        const tempsEcoule =
          maintenant -
          dernierSuppr;

        if (
          dernierSuppr === 0 ||
          tempsEcoule >= 2000
        ) {
          event.preventDefault();

          input.value = "";
          resultat.innerHTML = "";
          input.focus();
        }

        dernierSuppr =
          maintenant;
      }
    );

    window.addEventListener(
      "focus",
      () => input.focus()
    );

    chargerDictionnaire();
  </script>
</body>
</html>
